# Scale — the Surge CMS demo/marketing install at scale.surgemedia.us.
# Lives at /etc/nginx/conf.d/scale.conf on the surgemedia.us box, beside
# surge.conf (production). Proxies to scale.service on 127.0.0.1:3010.
#
# Uses `$connection_upgrade`, whose `map` is declared ONCE in surge.conf
# (deploy/nginx-surge.conf) — declaring it here too is a duplicate-map error.
# Cloudflare proxies the hostname (SSL mode "Full"), so the self-signed origin
# certificate production uses serves here as well.

server {
    listen 80;
    listen [::]:80;
    server_name scale.surgemedia.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scale.surgemedia.us;
    ssl_certificate     /etc/ssl/surge/origin.pem;
    ssl_certificate_key /etc/ssl/surge/origin.key;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Admin Channel WebSocket (/ws/admin).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # "Update & restart" and backup/restore can run for minutes.
        proxy_read_timeout 600s;
    }
}
