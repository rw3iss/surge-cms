# Reference nginx site config for the SiteSurge origin (surge.ryanweiss.net /
# surgemedia.us). Lives at /etc/nginx/conf.d/surge.conf on the server.
#
# The `map` + the two `proxy_set_header Upgrade/Connection` lines are REQUIRED
# for the Admin Channel WebSocket (`/ws/admin`) to work through nginx — without
# them nginx strips the Upgrade header and the handshake fails. `proxy_http_version
# 1.1` (already present) is also required for keep-alive upgrades.

# Maps the client's Upgrade header → the Connection header nginx sends upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name surge.ryanweiss.net surgemedia.us www.surgemedia.us;
    client_max_body_size 50m;
    # -- /docs -- the same generated documentation, at the top level ------
    #
    # Identical files to /fraud/docs/, mounted here because this is the address
    # the documents are shared under. BOTH paths are kept: /fraud/docs/ is what
    # publish-docs.sh and the generated cross-links assume.
    #
    # nginx matches the LONGEST prefix, so this wins over `location /` (the CMS)
    # wherever it sits. /docs is otherwise unused -- the CMS answered it only
    # with its SPA fallback.
    location /docs/ {
        alias /var/www/surge-fraud/docs/;
        index index.html;
        try_files $uri $uri/ =404;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/surge-fraud.htpasswd;

        add_header Cache-Control "private, no-store" always;
    }

    location = /docs {
        return 301 /docs/;
    }

    # ── /fraud — the PIX sub-application ─────────────────────────────────
    #
    # Source: ~/Sites/others/surge/fraud (a separate project — NOT this repo).
    # Everything under /fraud is password-protected at the edge, so the
    # credential check never reaches an application process.
    #
    # These MUST come before `location /`, which proxies to the CMS on :3001.
    # Between themselves the order does not matter: nginx selects the LONGEST
    # matching prefix, so /fraud/docs/ always wins over /fraud/.

    # Generated documentation — static files, published by the fraud project's
    # tools/publish-docs.sh. Kept out of the application deliberately: the docs
    # must stay readable when the app is down or not yet built.
    location /fraud/docs/ {
        alias /var/www/surge-fraud/docs/;
        index index.html;
        try_files $uri $uri/ =404;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/surge-fraud.htpasswd;

        # Protected content must not be held by Cloudflare or any shared proxy:
        # a cached copy would be served to the next visitor WITHOUT the auth
        # challenge. Cloudflare's default rules don't cache HTML, but this does
        # not depend on that staying true.
        add_header Cache-Control "private, no-store" always;
    }

    location = /fraud/docs {
        return 301 /fraud/docs/;
    }

    # The application owns the ROOT of the prefix (surgemedia.us/fraud).
    # Served by the PIX Nest process on :3005, which owns both the API
    # (/fraud/api/*) and the SPA shell.
    location /fraud/ {
        # NO basic auth here — deliberately. See the note below.
        #
        # The application authenticates itself: every route requires a login, roles are
        # ranked (viewer < analyst < admin), access is audited, and the refresh token is
        # httpOnly. Basic auth on top of that broke the app outright, because a browser
        # will not prompt for credentials on a fetch() that returns 401 — the SPA could
        # never sign in. The documents below keep basic auth; they have nothing else.

        # NO trailing slash on proxy_pass: the URI passes through unchanged so
        # the app still sees /fraud/... and its own root-relative asset URLs
        # resolve. A trailing slash would strip the prefix and break every asset
        # and redirect it emits.
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Protected content must never be held by Cloudflare or any shared
        # proxy — a cached copy would be served to the next visitor without the
        # auth challenge.
        add_header Cache-Control "private, no-store" always;
    }

    # Bare /fraud → /fraud/ (a trailing-slash location does not match the
    # slashless form).
    location = /fraud {
        return 301 /fraud/;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

