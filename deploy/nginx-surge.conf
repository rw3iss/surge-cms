# Reference nginx site config for the SiteSurge origin (surge.ryanweiss.net /
# surgemedia.us). Lives at /etc/nginx/conf.d/surge.conf on the server.
#
# The `map` + the two `proxy_set_header Upgrade/Connection` lines are REQUIRED
# for the Admin Channel WebSocket (`/ws/admin`) to work through nginx — without
# them nginx strips the Upgrade header and the handshake fails. `proxy_http_version
# 1.1` (already present) is also required for keep-alive upgrades.

# Maps the client's Upgrade header → the Connection header nginx sends upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name surge.ryanweiss.net surgemedia.us www.surgemedia.us;
    client_max_body_size 50m;
    # ── /fraud — password-protected static HTML ──────────────────────────
    #
    # Served straight from disk by nginx rather than through the app: these are
    # plain files with no CMS involvement, and putting the auth at the edge
    # keeps the credential check off the Node process entirely.
    #
    # MUST come before `location /`, which proxies everything to the app.
    location /fraud/ {
        alias /var/www/surge-fraud/;
        index index.html;
        try_files $uri $uri/ =404;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/surge-fraud.htpasswd;

        # Protected content must not be held by Cloudflare or any shared proxy:
        # a cached copy would be served to the next visitor WITHOUT the auth
        # challenge. Cloudflare's default rules don't cache HTML, but this does
        # not depend on that staying true.
        add_header Cache-Control "private, no-store" always;
    }

    # Bare /fraud → /fraud/ so the index resolves (a location with a trailing
    # slash does not match the slashless form).
    location = /fraud {
        return 301 /fraud/;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name surge.ryanweiss.net surgemedia.us www.surgemedia.us;
    ssl_certificate     /etc/ssl/surge/origin.pem;
    ssl_certificate_key /etc/ssl/surge/origin.key;
    client_max_body_size 50m;
    # ── /fraud — password-protected static HTML ──────────────────────────
    #
    # Served straight from disk by nginx rather than through the app: these are
    # plain files with no CMS involvement, and putting the auth at the edge
    # keeps the credential check off the Node process entirely.
    #
    # MUST come before `location /`, which proxies everything to the app.
    location /fraud/ {
        alias /var/www/surge-fraud/;
        index index.html;
        try_files $uri $uri/ =404;

        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/surge-fraud.htpasswd;

        # Protected content must not be held by Cloudflare or any shared proxy:
        # a cached copy would be served to the next visitor WITHOUT the auth
        # challenge. Cloudflare's default rules don't cache HTML, but this does
        # not depend on that staying true.
        add_header Cache-Control "private, no-store" always;
    }

    # Bare /fraud → /fraud/ so the index resolves (a location with a trailing
    # slash does not match the slashless form).
    location = /fraud {
        return 301 /fraud/;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
